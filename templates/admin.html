<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cán Sự Lớp - Quản Lý Điểm Danh</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f8f9fa; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .section { margin-bottom: 30px; border-bottom: 1px solid #ddd; padding-bottom: 20px; }
        input, button { padding: 8px; margin-top: 5px; }
        button { background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <h2>Trang Bảng Điều Khiển Cán Sự Lớp</h2>
    <p><a href="/logout">Đăng xuất</a></p>

    <!-- Quản lý Premium -->
    <div class="section">
        <h3>1. Quản Lý Premium Sinh Viên</h3>
        <input type="text" id="target_student_id" placeholder="Nhập mã sinh viên">
        <button onclick="togglePremium(1)">Mở Premium</button>
        <button onclick="togglePremium(0)" style="background:#dc3545;">Khóa Premium</button>
    </div>

    <!-- Tạo cán sự phụ -->
    <div class="section">
        <h3>2. Thêm Cán Sự Phụ Cho Lớp</h3>
        <input type="text" id="sub_username" placeholder="Tên đăng nhập mới"><br>
        <input type="password" id="sub_password" placeholder="Mật khẩu"><br>
        <input type="text" id="sub_class" placeholder="Mã lớp (để trống nếu dùng lớp hiện tại)"><br>
        <button onclick="createSubAdmin()">Thêm Cán Sự</button>
    </div>
</div>

<script>
    async function togglePremium(status) {
        const studentId = document.getElementById('target_student_id').value;
        const res = await fetch('/api/class-admin/toggle-student-premium', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ student_id: studentId, status: status })
        });
        const data = await res.json();
        alert(data.message);
    }

    async function createSubAdmin() {
        const username = document.getElementById('sub_username').value;
        const password = document.getElementById('sub_password').value;
        const classCode = document.getElementById('sub_class').value;

        const res = await fetch('/api/class-admin/create-sub-admin', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ username, password, class_code: classCode })
        });
        const data = await res.json();
        alert(data.message);
    }
</script>
</body>
</html>
