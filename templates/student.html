<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinh Viên - Điểm Danh Online</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef2f3; margin: 0; padding: 15px; }
        .card { max-width: 450px; background: white; margin: 20px auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-top: 0; }
        .badge { display: inline-block; padding: 4px 8px; background: #ffc107; color: #000; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-premium { background: linear-gradient(45deg, #ff8c00, #ff0080); color: white; font-size: 11px; padding: 3px 8px; border-radius: 10px; font-weight: bold; float: right; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; font-size: 14px; display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button, .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn-checkin { background: #28a745; color: white; }
        .btn-checkin:hover { background: #218838; }
        .btn-error { background-color: #ffc107; color: #000; }
        .alert { padding: 12px; border-radius: 6px; margin-top: 15px; text-align: center; font-weight: bold; display: none; }
        .alert-success { background: #d4edda; color: #155724; }
        .alert-danger { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="card">
    <span class="badge-premium">PREMIUM ENABLED</span>
    <h2>Điểm Danh Sinh Viên <span id="premiumBadge" class="badge" style="display:none;">PREMIUM 1-CLICK</span></h2>
    
    <div id="alertBox" class="alert"></div>

    <form id="checkinForm">
        <div class="form-group">
            <label for="student_id">Mã Số Sinh Viên (MSSV):</label>
            <input type="text" id="student_id" placeholder="VD: 24110001" required onblur="checkStudentStatus()">
        </div>

        <div id="extraFields">
            <div class="form-group">
                <label for="full_name">Họ và Tên:</label>
                <input type="text" id="full_name" placeholder="VD: Nguyễn Văn A">
            </div>
            <div class="form-group">
                <label for="class_code">Mã Lớp:</label>
                <input type="text" id="class_code" placeholder="VD: CNTT K65">
            </div>
        </div>

        <button type="button" class="btn btn-checkin" onclick="submitCheckin()">Thực Hiện Điểm Danh</button>
        <button type="button" class="btn btn-error" onclick="sendErrorReport()">⚠️ Báo Lỗi Sự Cố Điểm Danh</button>
    </form>
    
    <p style="text-align: center; margin-top: 15px;"><a href="/privacy-policy" style="color: #007bff; text-decoration: none;">Chính sách & Quyền riêng tư</a></p>
</div>

<script>
    let isRegistered = false;
    let hasPremium = false;

    // Tự động khôi phục dữ liệu từ localStorage
    window.onload = function() {
        if (localStorage.getItem('saved_student_id')) {
            document.getElementById('student_id').value = localStorage.getItem('saved_student_id');
            checkStudentStatus();
        }
    };

    async function checkStudentStatus() {
        const studentId = document.getElementById('student_id').value.trim();
        if (!studentId) return;

        try {
            const res = await fetch('/api/student/check-status', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ student_id: studentId })
            });
            const data = await res.json();

            if (data.registered) {
                isRegistered = true;
                hasPremium = data.has_premium;
                document.getElementById('full_name').value = data.full_name || '';
                document.getElementById('class_code').value = data.class_code || '';

                if (hasPremium) {
                    document.getElementById('extraFields').style.display = 'none';
                    document.getElementById('premiumBadge').style.display = 'inline-block';
                } else {
                    document.getElementById('extraFields').style.display = 'block';
                    document.getElementById('premiumBadge').style.display = 'none';
                }
            } else {
                isRegistered = false;
                hasPremium = false;
                document.getElementById('extraFields').style.display = 'block';
                document.getElementById('premiumBadge').style.display = 'none';
            }
        } catch (e) {
            console.error('Lỗi kiểm tra trạng thái sinh viên:', e);
        }
    }

    function submitCheckin() {
        const alertBox = document.getElementById('alertBox');
        alertBox.style.display = 'none';

        if (!navigator.geolocation) {
            showAlert('Trình duyệt không hỗ trợ định vị GPS!', false);
            return;
        }

        navigator.geolocation.getCurrentPosition(async (pos) => {
            const studentId = document.getElementById('student_id').value.trim();
            const fullName = document.getElementById('full_name').value.trim();
            const classCode = document.getElementById('class_code').value.trim();

            if (!studentId) {
                showAlert('Vui lòng nhập Mã sinh viên!', false);
                return;
            }

            // Đăng ký lần đầu nếu chưa có tài khoản
            if (!isRegistered) {
                const regRes = await fetch('/api/student/register-first-time', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ student_id: studentId, full_name: fullName, class_code: classCode })
                });
                const regData = await regRes.json();
                if (!regData.success) {
                    showAlert(regData.message, false);
                    return;
                }
            }

            // Thực hiện Điểm Danh (sử dụng API v2 có kiểm tra Device Fingerprint)
            const checkinRes = await fetch('/api/student/checkin-v2', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    student_id: studentId,
                    full_name: fullName,
                    class_code: classCode,
                    device_hash: getDeviceHash(),
                    lat: pos.coords.latitude,
                    lng: pos.coords.longitude
                })
            });

            const checkinData = await checkinRes.json();
            if (checkinData.success) {
                localStorage.setItem('saved_student_id', studentId);
                showAlert(checkinData.message, true);
            } else {
                showAlert(checkinData.message, false);
            }
        }, (err) => {
            showAlert('Vui lòng bật quyền truy cập vị trí GPS!', false);
        });
    }

    function showAlert(msg, isSuccess) {
        const box = document.getElementById('alertBox');
        box.innerText = msg;
        box.className = 'alert ' + (isSuccess ? 'alert-success' : 'alert-danger');
        box.style.display = 'block';
    }

    // Hàm tạo Device Fingerprint chống điểm danh hộ
    function getDeviceHash() {
        const raw = navigator.userAgent + navigator.language + screen.width + 'x' + screen.height;
        let hash = 0;
        for (let i = 0; i < raw.length; i++) {
            hash = ((hash << 5) - hash) + raw.charCodeAt(i);
            hash |= 0;
        }
        return 'DEV-' + Math.abs(hash);
    }

    // Gửi Báo lỗi khi không điểm danh được
    async function sendErrorReport() {
        const studentId = document.getElementById('student_id').value.trim();
        const fullName = document.getElementById('full_name').value.trim();
        const classCode = document.getElementById('class_code').value.trim();

        if (!studentId) {
            alert("Vui lòng nhập Mã sinh viên trước khi báo lỗi!");
            return;
        }

        const errorType = prompt("Nhập loại lỗi (ví dụ: Lỗi GPS, Không vào được mạng, Thiết bị lỗi):");
        const description = prompt("Mô tả chi tiết sự cố:");

        if (!errorType || !description) return;

        try {
            const res = await fetch('/api/student/report-error', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    student_id: studentId,
                    student_name: fullName,
                    class_code: classCode,
                    error_type: errorType,
                    description: description
                })
            });
            const data = await res.json();
            alert(data.message);
        } catch (e) {
            alert("Gửi báo lỗi thất bại, vui lòng thử lại sau!");
        }
    }
</script>
</body>
</html>
