<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điểm Danh Sinh Viên</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef2f3; margin: 0; padding: 15px; }
        .card { max-width: 450px; background: white; margin: 20px auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-top: 0; }
        .badge-premium { background: linear-gradient(45deg, #ff8c00, #ff0080); color: white; font-size: 11px; padding: 3px 8px; border-radius: 10px; font-weight: bold; float: right; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; font-size: 14px; display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn-checkin { background: #28a745; color: white; }
        .btn-premium { background: #6f42c1; color: white; }
        .status-box { padding: 12px; border-radius: 6px; margin-top: 15px; text-align: center; font-weight: bold; display: none; }
        .status-success { background: #d4edda; color: #155724; }
        .status-error { background: #f8d7da; color: #721c24; }
        .link-toggle { text-align: center; margin-top: 15px; font-size: 13px; }
        .link-toggle a { color: #007bff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <span class="badge-premium">PREMIUM ENABLED</span>
        <h2>Điểm Danh Lớp Học</h2>

        <!-- KHUNG DÀNH CHO PREMIUM (TỰ ĐỘNG LƯU SESSION) -->
        <div id="premium-welcome-box" style="display: none; background: #f0f4ff; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #cce5ff;">
            <p style="margin: 0; font-weight: bold; color: #004085;" id="user-info-text">Xin chào: ...</p>
            <small style="color: #666;">Đã xác thực tài khoản. Bấm bên dưới để điểm danh ngay!</small>
            <br><a href="#" onclick="logout()" style="color: #dc3545; font-size: 12px; font-weight: bold;">[Đăng xuất / Đổi tài khoản]</a>
        </div>

        <!-- KHUNG ĐĂNG NHẬP / NHẬP CƠ BẢN -->
        <div id="form-inputs">
            <div class="form-group">
                <label>Mã Số Sinh Viên (MSSV):</label>
                <input type="text" id="mssv" placeholder="VD: 24110001">
            </div>
            <div class="form-group">
                <label>Họ và Tên:</label>
                <input type="text" id="ho_ten" placeholder="VD: Nguyễn Văn A">
            </div>
            <div class="form-group" id="email-group">
                <label>Email Sinh Viên (Dùng cho bản Premium):</label>
                <input type="email" id="email" placeholder="VD: sv@truong.edu.vn">
            </div>
            <button class="btn btn-premium" id="btn-save-session" onclick="savePremiumAuth()">💾 Lưu Tài Khoản (Đăng Nhập 1-Chạm)</button>
        </div>

      <!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinh Viên - Điểm Danh Online</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
        .card { background: white; padding: 20px; border-radius: 8px; max-width: 450px; margin: 0 auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #218838; }
        .badge { display: inline-block; padding: 4px 8px; background: #ffc107; color: #000; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .alert { padding: 10px; margin-top: 15px; border-radius: 4px; display: none; }
        .alert-success { background: #d4edda; color: #155724; }
        .alert-danger { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="card">
    <h2>Điểm Danh Sinh Viên <span id="premiumBadge" class="badge" style="display:none;">PREMIUM 1-CLICK</span></h2>
    <div id="alertBox" class="alert"></div>

    <form id="checkinForm">
        <div class="form-group">
            <label>Mã Sinh Viên:</label>
            <input type="text" id="student_id" required onblur="checkStudentStatus()">
        </div>

        <div id="extraFields">
            <div class="form-group">
                <label>Họ và Tên:</label>
                <input type="text" id="full_name">
            </div>
            <div class="form-group">
                <label>Mã Lớp:</label>
                <input type="text" id="class_code">
            </div>
        </div>

        <button type="button" onclick="submitCheckin()">Thực Hiện Điểm Danh</button>
    </form>
    <p style="text-align: center; margin-top: 15px;"><a href="/privacy-policy">Chính sách & Quyền riêng tư</a></p>
</div>

<script>
    let isRegistered = false;
    let hasPremium = false;

    // Tự động khôi phục dữ liệu từ localStorage
    window.onload = function() {
        if(localStorage.getItem('saved_student_id')) {
            document.getElementById('student_id').value = localStorage.getItem('saved_student_id');
            checkStudentStatus();
        }
    };

    async function checkStudentStatus() {
        const studentId = document.getElementById('student_id').value.trim();
        if (!studentId) return;

        const res = await fetch('/api/student/check-status', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ student_id: studentId })
        });
        const data = await res.json();

        if (data.registered) {
            isRegistered = true;
            hasPremium = data.has_premium;
            document.getElementById('full_name').value = data.full_name;
            document.getElementById('class_code').value = data.class_code;

            if (hasPremium) {
                document.getElementById('extraFields').style.display = 'none';
                document.getElementById('premiumBadge').style.display = 'inline-block';
            } else {
                document.getElementById('extraFields').style.display = 'block';
                document.getElementById('premiumBadge').style.display = 'none';
            }
        } else {
            isRegistered = false;
            hasPremium = false;
            document.getElementById('extraFields').style.display = 'block';
            document.getElementById('premiumBadge').style.display = 'none';
        }
    }

    function submitCheckin() {
        const alertBox = document.getElementById('alertBox');
        alertBox.style.display = 'none';

        if (!navigator.geolocation) {
            alert('Trình duyệt không hỗ trợ định vị GPS!');
            return;
        }

        navigator.geolocation.getCurrentPosition(async (pos) => {
            const studentId = document.getElementById('student_id').value.trim();
            const fullName = document.getElementById('full_name').value.trim();
            const classCode = document.getElementById('class_code').value.trim();

            // Đăng ký lần đầu nếu chưa có tài khoản
            if (!isRegistered) {
                const regRes = await fetch('/api/student/register-first-time', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ student_id: studentId, full_name: fullName, class_code: classCode })
                });
                const regData = await regRes.json();
                if (!regData.success) {
                    showAlert(regData.message, false);
                    return;
                }
            }

            // Thực hiện Điểm Danh
            const checkinRes = await fetch('/api/student/checkin', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    student_id: studentId,
                    full_name: fullName,
                    class_code: classCode,
                    lat: pos.coords.latitude,
                    lng: pos.coords.longitude
                })
            });

            const checkinData = await checkinRes.json();
            if (checkinData.success) {
                localStorage.setItem('saved_student_id', studentId);
                showAlert(checkinData.message, true);
            } else {
                showAlert(checkinData.message, false);
            }
        }, (err) => {
            showAlert('Vui lòng bật quyền truy cập vị trí GPS!', false);
        });
    }

    function showAlert(msg, isSuccess) {
        const box = document.getElementById('alertBox');
        box.innerText = msg;
        box.className = 'alert ' + (isSuccess ? 'alert-success' : 'alert-danger');
        box.style.display = 'block';
    }
</script>
</body>
</html>
