<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điểm Danh Sinh Viên (Phiên Bản Premium)</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef2f3; margin: 0; padding: 20px; }
        .card { max-width: 450px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-top: 0; }
        .badge-premium { background: linear-gradient(45deg, #ff8c00, #ff0080); color: white; padding: 3px 8px; border-radius: 10px; font-size: 11px; vertical-align: middle; }
        input, button, textarea { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        .btn-checkin { background: #28a745; color: white; font-size: 16px; font-weight: bold; border: none; cursor: pointer; }
        .btn-checkin:hover { background: #218838; }
        .welcome-box { background: #e7f5ff; border: 1px solid #a5d8ff; padding: 12px; border-radius: 6px; margin-bottom: 15px; }
        .link-btn { color: #007bff; text-decoration: underline; cursor: pointer; font-size: 13px; text-align: center; display: block; margin-top: 12px; }
        #status-msg { text-align: center; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Điểm Danh Lớp Học <span class="badge-premium">PRO 1-CLICK</span></h2>

    <!-- KHUNG ĐĂNG NHẬP / LƯU THÔNG TIN -->
    <div id="login-box">
        <p style="font-size: 13px; color: #666; text-align: center;">Đăng nhập 1 lần duy nhất - Các lần sau chỉ cần bấm nút Điểm Danh!</p>
        <input type="email" id="acc_email" placeholder="Email (Google / Microsoft trường)">
        <input type="text" id="acc_mssv" placeholder="Mã Số Sinh Viên (MSSV)">
        <input type="text" id="acc_hoten" placeholder="Họ và Tên Sinh Viên">
        <button type="button" style="background: #007bff; color: white; border: none; font-weight: bold;" onclick="saveAccount()">Lưu Tài Khoản & Điểm Danh</button>
    </div>

    <!-- KHUNG ĐIỂM DANH 1-CLICK (HIỆN KHI ĐÃ ĐĂNG NHẬP) -->
    <div id="quick-checkin-box" style="display: none;">
        <div class="welcome-box">
            <b>Xin chào:</b> <span id="user-name-display"></span><br>
            <b>MSSV:</b> <span id="user-mssv-display"></span>
            <span class="link-btn" style="display: inline; float: right;" onclick="logout()">[Đổi TK]</span>
        </div>
        <button class="btn-checkin" onclick="startCheckin()">🎯 ĐIỂM DANH NGAY (1-TOUCH)</button>
    </div>

    <div id="status-msg"></div>

    <!-- NÚT & FORM BÁO LỖI -->
    <span class="link-btn" onclick="toggleBaoLoi()">Gặp sự cố thiết bị/GPS? Gửi báo lỗi cho Cán sự</span>

    <div id="bao-loi-box" style="display: none; background: #fff3cd; padding: 15px; border-radius: 8px; margin-top: 15px;">
        <h4 style="margin: 0 0 10px 0;">Yêu Cầu Reset Thiết Bị</h4>
        <input type="text" id="bl_mssv" placeholder="MSSV">
        <input type="text" id="bl_hoten" placeholder="Họ tên">
        <textarea id="bl_lydo" placeholder="Lý do lỗi (VD: Đổi điện thoại, định vị sai...)"></textarea>
        <button style="background: #ffc107; border: none; font-weight: bold; margin-top: 8px;" onclick="sendBaoLoi()">Gửi Báo Lỗi</button>
    </div>
</div>

<script>
    // Tự sinh hoặc lấy Device ID duy nhất của trình duyệt
    let deviceId = localStorage.getItem('app_device_id');
    if (!deviceId) {
        deviceId = 'dev_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
        localStorage.setItem('app_device_id', deviceId);
    }

    document.addEventListener("DOMContentLoaded", () => {
        checkAutoLogin();
    });

    function checkAutoLogin() {
        const session = JSON.parse(localStorage.getItem('student_session') || '{}');
        if (session.mssv && session.hoTen) {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('quick-checkin-box').style.display = 'block';
            document.getElementById('user-name-display').innerText = session.hoTen;
            document.getElementById('user-mssv-display').innerText = session.mssv;
        } else {
            document.getElementById('login-box').style.display = 'block';
            document.getElementById('quick-checkin-box').style.display = 'none';
        }
    }

    function saveAccount() {
        const email = document.getElementById('acc_email').value;
        const mssv = document.getElementById('acc_mssv').value;
        const hoTen = document.getElementById('acc_hoten').value;

        if (!mssv || !hoTen) {
            alert("Vui lòng điền đầy đủ MSSV và Họ Tên!");
            return;
        }

        localStorage.setItem('student_session', JSON.stringify({ email, mssv, hoTen }));
        checkAutoLogin();
        startCheckin();
    }

    function logout() {
        localStorage.removeItem('student_session');
        checkAutoLogin();
    }

    function startCheckin() {
        const session = JSON.parse(localStorage.getItem('student_session') || '{}');
        const msg = document.getElementById('status-msg');
        msg.style.color = 'blue';
        msg.innerText = "Đang kiểm tra vị trí GPS...";

        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                (pos) => sendData(session, pos.coords.latitude, pos.coords.longitude),
                (err) => sendData(session, null, null),
                { enableHighAccuracy: true, timeout: 5000 }
            );
        } else {
            sendData(session, null, null);
        }
    }

    async function sendData(session, lat, lng) {
        const msg = document.getElementById('status-msg');
        const payload = {
            mssv: session.mssv,
            ho_ten: session.hoTen,
            email: session.email,
            device_id: deviceId,
            lat: lat,
            lng: lng
        };

        try {
            const res = await fetch('/api/student/checkin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            
            if (data.success) {
                msg.style.color = 'green';
                msg.innerText = data.message;
            } else {
                msg.style.color = 'red';
                msg.innerText = data.message;
            }
        } catch (e) {
            msg.style.color = 'red';
            msg.innerText = "Lỗi kết nối máy chủ!";
        }
    }

    function toggleBaoLoi() {
        const box = document.getElementById('bao-loi-box');
        box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }

    async function sendBaoLoi() {
        const mssv = document.getElementById('bl_mssv').value;
        const ho_ten = document.getElementById('bl_hoten').value;
        const ly_do = document.getElementById('bl_lydo').value;

        if (!mssv || !ho_ten || !ly_do) {
            alert("Vui lòng điền đủ thông tin báo lỗi!");
            return;
        }

        await fetch('/api/student/bao-loi', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mssv, ho_ten, ly_do, device_id: deviceId })
        });
        alert("Đã gửi báo lỗi thành công! Cán sự sẽ xem xét reset thiết bị cho bạn.");
        toggleBaoLoi();
    }
</script>
</body>
</html>
